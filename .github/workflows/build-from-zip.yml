name: Build and publish SVU LREC Engine
on:
  push:
    branches: [main]
    paths: ['SVU-LREC-Coolify-Engine-v0.1.0.zip', '.github/workflows/build-from-zip.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack engine source
        run: |
          test -s SVU-LREC-Coolify-Engine-v0.1.0.zip || { echo 'Missing engine ZIP'; exit 1; }
          mkdir -p engine
          unzip -q SVU-LREC-Coolify-Engine-v0.1.0.zip -d engine
          test -s engine/Dockerfile
          test -s engine/src/converter.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./engine
          push: true
          tags: ghcr.io/hussamalbarouki/svu-lrec-engine:main
          platforms: linux/amd64
